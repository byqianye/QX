appId: com.qx.yingshi
productName: QX影视
directories:
  output: release/rc
  buildResources: build

asar: true

files:
  - dist/electron/**/*
  - dist/renderer/**/*
  - package.json

extraResources:
  - from: dist/electron-runtime
    to: electron-runtime
  - from: build/assets/qx-yingshi.ico
    to: brand/qx-yingshi.ico

win:
  icon: build/assets/qx-yingshi.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: QX影视-RC-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: QX影视
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

portable:
  artifactName: QX影视-RC-Portable-${version}-${arch}.${ext}
