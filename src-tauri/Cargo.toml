[package]
name = "qx-yingshi"
version = "0.9.0"
description = "QX影视 Tauri desktop shell"
authors = ["QX影视"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[lib]
name = "qx_yingshi_lib"
path = "src/lib.rs"

[[bin]]
name = "qx-yingshi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8.0" }
